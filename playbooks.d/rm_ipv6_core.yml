---
- name: Disable IPv6 on Ubuntu hosts
  hosts: all
  become: yes
  
  tasks:
    - name: Disable IPv6 via sysctl
      sysctl:
        name: "{{ item }}"
        value: '1'
        state: present
        reload: yes
        sysctl_set: yes
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
        - net.ipv6.conf.lo.disable_ipv6

    - name: Add IPv6 disable to GRUB
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        line: 'GRUB_CMDLINE_LINUX="ipv6.disable=1"'
        insertafter: EOF
        create: yes

    - name: Update GRUB
      ansible.builtin.command: update-grub
      args:
        creates: /boot/grub/grub.cfg

    - name: Check if reboot needed
      ansible.builtin.shell: ip addr show | grep -q 'inet6'
      register: ipv6_active
      failed_when: false
      changed_when: false

    - name: Reboot to apply IPv6 disable
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: ipv6_active.rc == 0
