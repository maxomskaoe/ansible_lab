- name: Configure dnsmasq on routers with keepalived
  hosts: routers
  become: yes

  vars:
    internal_interface: "ens18"
    external_interface: "ens19"
    vip: "192.168.5.1"
    upstream_dns:
      - "8.8.8.8"
      - "1.1.1.1"
    dhcp_range_start_primary: "192.168.5.170"
    dhcp_range_end_primary: "192.168.5.184"
    dhcp_range_start_secondary: "192.168.5.185"
    dhcp_range_end_secondary: "192.168.5.199"

  tasks:
    - name: Remove old dnsmasq.d config to avoid conflicts
      ansible.builtin.file:
        path: /etc/dnsmasq.d/lab.conf
        state: absent

    - name: Deploy dnsmasq main configuration
      ansible.builtin.template:
        src: dnsmasq.conf.j2
        dest: /etc/dnsmasq.conf
        mode: '0644'
      notify: restart dnsmasq

    - name: Ensure dnsmasq is enabled
      ansible.builtin.systemd:
        name: dnsmasq
        state: started
        enabled: yes

  handlers:
    - name: restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
